<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See how players move, fight, loot and die on LILA BLACK's maps." />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LILA Journeys" />
    <title>LILA BLACK Player Journeys</title>
    <meta name="theme-color" content="#0e0f12" />
    <style>
      /* Shown until the app starts (replaced by it): never a blank page while the files arrive. */
      html, body { margin: 0; height: 100%; background: #0e0f12; }
      .boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8b909a; font: 12.5px Inter, ui-sans-serif, system-ui, sans-serif; }
      .boot b { font-weight: 800; letter-spacing: 0.32em; padding-left: 0.32em; font-size: 15px; color: #e8e9ec; }
      .boot i { width: 180px; height: 3px; border-radius: 3px; background: #23262d; overflow: hidden; }
      .boot i::after { content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #4cc9f0, transparent); animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><b>LILA BLACK</b><i></i><span>Loading the player journeys</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
