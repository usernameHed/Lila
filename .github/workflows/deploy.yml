# Checks, builds and deploys the tool to Cloudflare on every push to main (and by hand from the Actions tab).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Explain a skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN repository secret, see the README."
